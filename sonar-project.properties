sonar.projectKey=Popolitics_auth-service
sonar.organization=popolitics
sonar.sources=.
sonar.tests=authentication
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/tests/**,.venv/**,.idea/**,coverage.xml
sonar.coverage.exclusions=**/migrations/**,config/asgi.py,config/wsgi.py
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true

