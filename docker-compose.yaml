version: '3.8'

services:
  # Base de données PostgreSQL dédiée
  db:
    image: postgres:16-alpine
    container_name: auth_postgres_db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Microservice d'authentification Django
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      - DEBUG=True
      - DB_NAME=auth_db
      - DB_USER=auth_user
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_HOST=db
      - DB_PORT=5432
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      # Chemins relatifs à /app, où le dossier du projet est monté.
      - JWT_PRIVATE_KEY_FILE=${JWT_PRIVATE_KEY_FILE:-}
      - JWT_PUBLIC_KEY_FILE=${JWT_PUBLIC_KEY_FILE:-}
      # Emails capturés par Mailpit (http://localhost:8025), jamais envoyés réellement.
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@localhost}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - .:/app
      - /app/.venv

  # Faux serveur SMTP de dev : interface web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: auth_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
