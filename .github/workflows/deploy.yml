
name: Build, Push to GHCR and Update GitOps

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'accounts/**'
      - 'authentication/**'
      - 'config/**'
      - 'manage.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - '.github/workflows/deploy.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Préparer le nom de l'image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build et publication de l'image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  update-gitops:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    concurrency:
      group: auth-service-infra-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      INFRA_BRANCH: ${{ github.ref_name }}
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Vérifier le token GitOps
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_REPO_TOKEN" ]; then
            echo "::error::INFRA_REPO_TOKEN manquant"
            exit 1
          fi

      - name: Checkout du dépôt infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Popolitics/infra
          ref: ${{ env.INFRA_BRANCH }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Mettre à jour le tag de l'overlay
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          branch = os.environ["INFRA_BRANCH"]
          environment = "prod" if branch == "main" else "dev"

          path = Path(
              f"k8s/overlays/{environment}/auth_service/kustomization.yaml"
          )

          image = os.environ["IMAGE_NAME"]
          tag = os.environ["IMAGE_TAG"]

          if image != "ghcr.io/popolitics/auth-service":
              raise SystemExit("Nom d'image inattendu")

          if not re.fullmatch(r"[0-9a-f]{40}", tag):
              raise SystemExit("Tag SHA invalide")

          if not path.is_file():
              raise SystemExit(f"Fichier introuvable : {path}")

          content = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(^[ \t]*newTag:[ \t]*)(['\"]?)[^'\"\s#]+(['\"]?)",
              re.MULTILINE,
          )

          updated, count = pattern.subn(
              lambda m: m.group(1) + '"' + tag + '"',
              content,
          )

          if count != 1:
              raise SystemExit(
                  f"Un seul newTag attendu, trouvé : {count}"
              )

          path.write_text(updated, encoding="utf-8")
          print(f"Image {image}:{tag} -> {path}")

      - name: Commit et push GitOps
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m \
            "ci(auth): update ${INFRA_BRANCH} image to ${IMAGE_TAG}"

          git push origin "HEAD:${INFRA_BRANCH}"
