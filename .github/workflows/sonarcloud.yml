name: sonarcloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-1234567890
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: auth_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install uv
        run: >-
          python -m pip install --only-binary=:all: uv==0.12.18
      - name: Install dependencies
        run: uv sync --frozen --no-build
      - name: Check migrations
        run: uv run --frozen --no-build python manage.py makemigrations --check --dry-run
      - name: Apply migrations on a fresh database
        run: uv run --frozen --no-build python manage.py migrate --noinput
      - name: Run tests with coverage
        run: uv run --frozen --no-build coverage run manage.py test --noinput
      - name: Generate coverage report
        run: uv run --frozen --no-build coverage xml
      - name: Check coverage threshold
        run: uv run --frozen --no-build coverage report --fail-under=80
      - name: SonarQube Scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
